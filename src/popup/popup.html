<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DumbTube</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141414;
        --card: #1e1e1e;
        --line: rgba(255, 255, 255, 0.08);
        --hover: rgba(255, 255, 255, 0.04);
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --faint: #8a8a8a;
        --red: #ff2a2a;
        --switch-off: #3a3a3a;
        --focus: #ffffff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --card: #f4f4f4;
          --line: rgba(0, 0, 0, 0.08);
          --hover: rgba(0, 0, 0, 0.04);
          --text: #141414;
          --muted: #5f5f5f;
          --faint: #6b6b6b;
          --red: #d91c1c;
          --switch-off: #c4c4c4;
          --focus: #141414;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        width: 320px;
        font-family: system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 16px 14px;
      }

      header img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      header p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 0 16px 6px;
      }

      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 12px 10px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.02em;
      }

      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--red);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .stat .link { margin-top: 6px; }

      .breakdown {
        margin: 0 16px 10px;
        color: var(--muted);
        font-size: 11px;
      }

      section { padding: 4px 8px 8px; }

      h2 {
        margin: 8px 8px 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin: 0;
        padding: 10px 8px;
        border-radius: 12px;
        cursor: pointer;
      }

      .row:hover { background: var(--hover); }
      .row[hidden] { display: none; }

      .copy { flex: 1; min-width: 0; }

      .copy b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .copy small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.35;
      }

      .switch {
        position: relative;
        width: 36px;
        height: 22px;
        flex: none;
      }

      .switch input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .switch i {
        position: absolute;
        inset: 0;
        border-radius: 99px;
        background: var(--switch-off);
        transition: background 0.15s ease;
        pointer-events: none;
      }

      .switch i::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease;
      }

      .switch input:checked + i { background: var(--red); }
      .switch input:checked + i::after { transform: translateX(14px); }
      .switch input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }

      .minutes {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 8px 8px;
        padding: 0 10px 6px 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .minutes input {
        width: 60px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        padding: 6px 8px;
      }

      footer {
        padding: 6px 16px 14px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 11px;
        line-height: 1.7;
      }

      kbd {
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        color: var(--text);
        font: 11px ui-monospace, monospace;
      }

      @media (prefers-reduced-motion: reduce) {
        .switch i,
        .switch i::after { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../../icons/dumbtube-48x48.png" alt="" />
      <div>
        <h1>DumbTube</h1>
        <p>Search, watch, skip the rest</p>
      </div>
    </header>

    <div class="stats">
      <div class="stat">
        <span id="count-label">Ads skipped</span>
        <strong id="count" aria-labelledby="count-label count">0</strong>
        <button id="reset" class="link" type="button" aria-label="Reset ad counts">Reset</button>
      </div>
      <div class="stat">
        <span id="today-label">Skipped today</span>
        <strong id="today" aria-labelledby="today-label today">0</strong>
      </div>
    </div>
    <p class="breakdown" id="breakdown">Sponsored 0 · Video 0 · Google 0</p>

    <section aria-labelledby="youtube-heading">
      <h2 id="youtube-heading">YouTube</h2>
      <label class="row">
        <span class="copy">
          <b>Dumb YouTube</b>
          <small id="dumb-youtube-desc">Hide the home feed, subscriptions, and Up next</small>
        </span>
        <span class="switch"><input id="dumb-youtube" type="checkbox" role="switch" aria-describedby="dumb-youtube-desc" /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Hide Shorts</b>
          <small id="hide-shorts-desc">Shelves, sidebar, and the Shorts tab</small>
        </span>
        <span class="switch"><input id="hide-shorts" type="checkbox" role="switch" aria-describedby="hide-shorts-desc" checked /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Hide Playables</b>
          <small id="hide-playables-desc">The YouTube Playables game shelf</small>
        </span>
        <span class="switch"><input id="hide-playables" type="checkbox" role="switch" aria-describedby="hide-playables-desc" checked /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Hide sponsored cards</b>
          <small id="hide-sponsored-desc">Feed, search, and sidebar promotions</small>
        </span>
        <span class="switch"><input id="hide-sponsored" type="checkbox" role="switch" aria-describedby="hide-sponsored-desc" checked /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Skip video ads</b>
          <small id="skip-video-ads-desc">Pre-roll and mid-roll ads in the player</small>
        </span>
        <span class="switch"><input id="skip-video-ads" type="checkbox" role="switch" aria-describedby="skip-video-ads-desc" /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Block autoplay</b>
          <small id="block-autoplay-desc">Don’t start the next video</small>
        </span>
        <span class="switch"><input id="block-autoplay" type="checkbox" role="switch" aria-describedby="block-autoplay-desc" /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Hide comments</b>
          <small id="hide-comments-desc">Comments under the video and on Shorts</small>
        </span>
        <span class="switch"><input id="hide-comments" type="checkbox" role="switch" aria-describedby="hide-comments-desc" /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Hide the sidebar</b>
          <small id="hide-sidebar-desc">Leave search as the way around YouTube</small>
        </span>
        <span class="switch"><input id="hide-sidebar" type="checkbox" role="switch" aria-describedby="hide-sidebar-desc" /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Open on search</b>
          <small id="open-search-desc">Start on the search box instead of Home</small>
        </span>
        <span class="switch"><input id="open-search" type="checkbox" role="switch" aria-describedby="open-search-desc" /><i></i></span>
      </label>

      <label class="row">
        <span class="copy">
          <b>Focus timer</b>
          <small id="focus-timer-desc">Pause after a set number of minutes</small>
        </span>
        <span class="switch"><input id="focus-timer" type="checkbox" role="switch" aria-describedby="focus-timer-desc" /><i></i></span>
      </label>
      <div class="minutes">
        <input id="focus-minutes" type="number" min="5" max="180" value="25" aria-label="Focus timer length in minutes" />
        <span aria-hidden="true">minutes</span>
      </div>

      <label class="row">
        <span class="copy">
          <b>Daily limit</b>
          <small id="daily-limit-desc">Pause YouTube after this much watching each day</small>
        </span>
        <span class="switch"><input id="daily-limit" type="checkbox" role="switch" aria-describedby="daily-limit-desc watched-today" /><i></i></span>
      </label>
      <div class="minutes">
        <input id="daily-limit-minutes" type="number" min="5" max="600" step="5" value="60" aria-label="Daily limit in minutes" />
        <span><span aria-hidden="true">minutes · </span><span id="watched-today">0 min watched today</span></span>
      </div>
    </section>

    <section aria-labelledby="ads-heading">
      <h2 id="ads-heading">Ads</h2>
      <label class="row">
        <span class="copy">
          <b>Hide Google ads</b>
          <small id="hide-google-ads-desc">AdSense and display ads on other sites</small>
        </span>
        <span class="switch"><input id="hide-google-ads" type="checkbox" role="switch" aria-describedby="hide-google-ads-desc" checked /><i></i></span>
      </label>
      <label class="row" id="site-row" hidden>
        <span class="copy">
          <b>On <span id="site-name">this site</span></b>
          <small id="site-ads-desc">Turn off to leave Google ads alone here</small>
        </span>
        <span class="switch"><input id="site-ads" type="checkbox" role="switch" aria-describedby="site-ads-desc" checked /><i></i></span>
      </label>
      <label class="row">
        <span class="copy">
          <b>Pause hiding</b>
          <small id="pause-hiding-desc" aria-live="polite">Show everything again for 10 minutes</small>
        </span>
        <span class="switch"><input id="pause-hiding" type="checkbox" role="switch" aria-describedby="pause-hiding-desc" /><i></i></span>
      </label>
    </section>

    <footer>
      <span id="shortcuts">Shortcuts: <kbd id="shortcut-pause">—</kbd> pause · <kbd id="shortcut-focus">—</kbd> focus timer</span>
      · <button id="edit-shortcuts" class="link" type="button">Change</button>
    </footer>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
